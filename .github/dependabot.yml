version: 2
updates:
  # Dev-only tooling (the visitor-facing site has zero runtime dependencies).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Gaborone
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    labels:
      - dependencies
    ignore:
      # jsdom >=30 requires Node >=22; this repo still supports Node 20.
      # Revisit when the Node 20 floor is raised.
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is the native compiler port; stay on 5.x until its
      # checkJs behaviour is validated against this codebase.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Keep GitHub Actions pinned majors current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Gaborone
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
